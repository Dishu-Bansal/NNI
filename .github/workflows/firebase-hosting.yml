name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build Flutter web and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same toolchain used to develop locally (Dart 3.11.5).
          flutter-version: 3.41.7

      - name: Enable web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v15.28.2
        with:
          args: deploy --only hosting --project national-nursing-institute
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
